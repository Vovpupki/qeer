name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files exist
        run: |
          if [ ! -f main.py ] || [ ! -f buildozer.spec ]; then
            echo "ERROR: main.py and buildozer.spec must be in the repository root!"
            ls -la
            exit 1
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev ccache patch gettext

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython==0.29.36

      - name: Build Android APK
        run: |
          (yes || true) | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmus-player-apk
          path: bin/*.apk
